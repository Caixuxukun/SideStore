name: Imported profile signing rules
on:
  push:
    branches: [fix/third-party-signing]
  workflow_dispatch:
jobs:
  profile-rules:
    # Use Intel capacity; the ARM64 queue may fail before a runner is assigned.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run profile regression tests
        run: |
          swiftc -swift-version 6 SideStore/Core/Profiles/SigningProfileRules.swift scripts/tests/SigningProfileRulesTests.swift -o "$RUNNER_TEMP/profile-tests"
          "$RUNNER_TEMP/profile-tests"
      - name: Compile and run database regression tests
        run: |
          swiftc -swift-version 5 AltStore/Core/Model/DatabaseManager/PersistentContainer.swift scripts/tests/PersistentContainerTests.swift -o "$RUNNER_TEMP/database-tests"
          "$RUNNER_TEMP/database-tests"
      - name: Compile and run provisioning profile locator tests
        run: |
          swiftc -swift-version 6 SideStore/Core/Profiles/ProvisioningProfileLocator.swift scripts/tests/ProvisioningProfileLocatorTests.swift -o "$RUNNER_TEMP/profile-locator-tests"
          "$RUNNER_TEMP/profile-locator-tests"
