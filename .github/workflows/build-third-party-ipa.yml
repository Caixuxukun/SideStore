name: Build third-party signing IPA
on:
  push:
    branches: [fix/third-party-signing]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ipa:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install packaging tools
        run: brew install ldid xcbeautify
      - name: Build and package IPA
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -version
          mkdir -p build/logs
          make -B build 2>&1 | tee build/logs/build.log | xcbeautify --renderer github-actions
          make fakesign
          make ipa
          unzip -t SideStore.ipa
          shasum -a 256 SideStore.ipa > SideStore.ipa.sha256
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-third-party-signing
          path: |
            SideStore.ipa
            SideStore.ipa.sha256
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-build-log
          path: build/logs/build.log
          if-no-files-found: ignore
